<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silcar Clean - Productos de limpieza</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./CSS/style.css">

    <!-- JavaScript -->
    <script src="./JS/main.js" defer></script>
</head>

<body>

    <!-- Encabezado -->
<header>

    <img 
        src="./Logo azul.png" 
        alt="Logo Silcar Clean" 
        class="logo"
    >

    <div class="titulo-header">
        <h1>Silcar Clean</h1>
        <p>Gestión de productos de limpieza</p>
    </div>

</header>


    <main>

        <!-- Formulario para agregar productos -->
        <section class="formulario">

            <h2>Agregar producto</h2>

            <form id="formulario-producto">

                <div class="campo">

                    <label for="nombre">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej: Detergente"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="precio">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="precio"
                        placeholder="Ej: 12000"
                        min="1"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="Ej: 20"
                        min="0"
                        required
                    >

                </div>


                <button type="submit">
                    + Agregar producto
                </button>

            </form>

        </section>


        <!-- Lista de productos -->
        <section class="productos">

            <div class="encabezado-productos">

                <h2>Productos disponibles</h2>

                <!-- Buscador -->
                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar producto..."
                >

            </div>


            <!-- Mensajes de feedback -->
            <div id="mensaje"></div>


            <!-- Aquí JavaScript renderiza los productos -->
            <div id="contenedor-productos"></div>

        </section>

    </main>

</body>

</html>
